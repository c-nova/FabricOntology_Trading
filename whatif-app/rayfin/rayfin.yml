id: trading-whatif
name: trading-whatif
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      # In git, the last entry is a placeholder. Before "rayfin up", run
      # "python3 scripts/environment_ids.py restore" at the repository root.
      # Before committing, run "redact" and then "check" (see ../../AGENTS.md).
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://__APP_HOST__
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  functions:
    enabled: true
    auth:
      type: application
    path: packages/functions
    buildCommand: npm run build
  storage:
    enabled: false
