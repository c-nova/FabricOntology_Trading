id: trading-whatif
name: trading-whatif
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      # "rayfin up" appends the live hosting URL to this list. Do not commit that line:
      # after deploying, run "git restore whatif-app/rayfin/rayfin.yml" (see ../../AGENTS.md).
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  functions:
    enabled: true
    auth:
      type: application
    path: packages/functions
    buildCommand: npm run build
  storage:
    enabled: false
